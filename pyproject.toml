[project]
name = "continuum"
version = "0.7.1"
description = "Agentic incident-response memory that survives the agent being killed — CockroachDB × AWS Hackathon 2026"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Arjun Ganesh" }]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.14"
strict = false
# boto3, psycopg, mcp, gradio ship partial or no stubs; typing our own code is
# the goal here, not litigating third-party stub coverage.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["agents", "api", "observability"]

[tool.coverage.report]
show_missing = true
