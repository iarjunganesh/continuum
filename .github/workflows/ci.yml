name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest

    # Fake credentials satisfy Settings(); unit tests mock all outbound calls
    env:
      COCKROACH_DATABASE_URL: "postgresql://root@localhost:26257/defaultdb?sslmode=disable"
      AWS_REGION: "eu-central-1"
      AWS_ACCESS_KEY_ID: "mock-access-key-for-testing-only"
      AWS_SECRET_ACCESS_KEY: "mock-secret-key-for-testing-only"
      STEP_EXECUTION_SECONDS: "0"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Type check (Mypy)
        run: mypy agents/ api/ observability/ config.py

      # The Devpost paste mirror is generated from README.md. If someone edits
      # the README without regenerating, fail here rather than ship a stale
      # submission doc.
      - name: Devpost mirror is current
        run: python scripts/build_devpost_readme.py --check

      # Documentation drift: version fields that disagree, dates describing
      # work as done before it happened, stated test/ADR counts that no longer
      # match, broken links, stale generated files. Every one of these has gone
      # wrong here at least once and was caught by a human reading carefully —
      # which is neither reliable nor repeatable, hence the gate.
      - name: Documentation agrees with the repo
        run: python scripts/check_drift.py

      # The redaction gate covers video as well as PNGs, and samples video
      # frames by shelling out to ffmpeg/ffprobe. Neither is present on a
      # GitHub runner, and the gate raises rather than skipping — a video
      # check that quietly no-ops on the one machine that runs on every push
      # is the same hole that let an unmasked face ship in the first place.
      - name: Install ffmpeg (the redaction gate samples video frames)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Judge-facing evidence frames carry a real person's photograph and an AWS
      # account id, both masked by declared regions. Nothing else notices if a
      # re-captured frame lands unredacted: the image renders fine, every other
      # gate is green, and the only symptom is a face shipping to judges. No
      # cluster or AWS dependency, so it runs on every push.
      - name: Evidence frames are redacted
        run: python scripts/redact_evidence.py --check

      # Ephemeral, insecure, single-node — CI-only, never how a real cluster
      # is run. This is what lets tests/integration exercise the recovery
      # guarantee (ARCHITECTURE.md §3) against a real CockroachDB instance
      # instead of only against mocks.
      - name: Start ephemeral CockroachDB (single-node, insecure, CI-only)
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 30); do
            docker exec crdb ./cockroach sql --insecure -e "SELECT 1" && break
            sleep 1
          done

      - name: Apply schema (enables vector index preview feature first)
        run: |
          docker exec crdb ./cockroach sql --insecure -e "SET CLUSTER SETTING feature.vector_index.enabled = true;"
          docker exec -i crdb ./cockroach sql --insecure < infra/schema.sql

      - name: Tests + coverage
        run: |
          pytest tests/unit tests/integration \
            --cov=agents --cov=api --cov=observability \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
